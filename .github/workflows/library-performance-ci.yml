name: Library Performance CI

on:
  push:
    branches:
      - flacman-0.4-library-performance
      - flacman-0.4-ui-trim
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "fastlane/**"
      - "metadata/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "fastlane/**"
      - "metadata/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-performance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run debug unit tests
        run: bash ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: library-performance-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
